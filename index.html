<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1c1b19">
  <title>stras-go</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="status">
    <div class="player" id="player-black" aria-label="Black captures">
      <span class="stone black"></span>
      <span class="captures" id="captures-black" title="Stones captured by Black">0</span>
    </div>
    <div class="meta">
      <button id="undo" type="button" aria-label="Undo" title="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="share" type="button" aria-label="Copy link" title="Copy link">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button id="reset" type="button" aria-label="New game" title="New game">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button id="menu" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
    </div>
    <div class="player" id="player-white" aria-label="White captures">
      <span class="captures" id="captures-white" title="Stones captured by White">0</span>
      <span class="stone white"></span>
    </div>
    <div class="message" id="message" aria-live="polite"></div>
  </header>

  <main>
    <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Go board"></svg>
  </main>

  <footer class="controls" id="controls">
    <button id="pass" type="button" aria-label="Pass" title="Pass">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    <button id="resign" type="button" aria-label="Resign" title="Resign">
      <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>
    <button id="accept" type="button" class="primary" aria-label="Accept score" title="Accept score" hidden>
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </footer>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <fieldset>
        <legend>Board size</legend>
        <div class="segmented">
          <label><input type="radio" name="size" value="9"><span>9&times;9</span></label>
          <label><input type="radio" name="size" value="13"><span>13&times;13</span></label>
          <label><input type="radio" name="size" value="19" checked><span>19&times;19</span></label>
        </div>
      </fieldset>
      <label class="row">
        <span>Handicap</span>
        <select name="handicap">
          <option value="0">None</option>
          <option value="2">2 stones</option>
          <option value="3">3 stones</option>
          <option value="4">4 stones</option>
          <option value="5">5 stones</option>
          <option value="6">6 stones</option>
          <option value="7">7 stones</option>
          <option value="8">8 stones</option>
          <option value="9">9 stones</option>
        </select>
      </label>
      <label class="row">
        <span>Komi</span>
        <select name="komi">
          <option value="0">0</option>
          <option value="0.5">0.5</option>
          <option value="5.5">5.5</option>
          <option value="6.5">6.5</option>
          <option value="7.5" selected>7.5</option>
        </select>
      </label>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="start">Start new game</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" hidden></div>
</body>
</html>
